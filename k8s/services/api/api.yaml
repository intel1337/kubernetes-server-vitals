# --- Deployment : fait tourner le container ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api                   # comment le Deployment retrouve "ses" pods
  template:
    metadata:
      labels:
        app: api                 # doit matcher le selector ci-dessus
    spec:
      nodeSelector:
        role: app                # force ce pod sur ton node labellisé "app"
      containers:
        - name: api
          image: i1337x/api:latest # TODO: builder + push l'image avant de déployer (pas encore fait, cf. build.bat pour les decoys)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PROD
              value: "1"          # bascule health-check.service.ts sur les DNS internes K8s (http://decoy-x:3000) au lieu de localhost
---
# --- Service : donne un nom réseau stable ---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api                     # cible les pods ayant ce label
  ports:
    - port: 8080
      targetPort: 8080
